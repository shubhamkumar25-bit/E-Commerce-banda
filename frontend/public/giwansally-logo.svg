<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" fill="none">
  <defs>
    <linearGradient id="goldH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C778" />
      <stop offset="50%" stop-color="#C7A45B" />
      <stop offset="100%" stop-color="#A57D32" />
    </linearGradient>
    <linearGradient id="greenH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B593E" />
      <stop offset="100%" stop-color="#103A29" />
    </linearGradient>
  </defs>

  <!-- Logo Icon Badge -->
  <g transform="translate(10, 8)">
    <circle cx="32" cy="32" r="30" stroke="url(#goldH)" stroke-width="1.8" stroke-dasharray="3 2" />
    <circle cx="32" cy="32" r="27" fill="url(#greenH)" />
    <!-- Botanical Droplet -->
    <path d="M32 12 C26 21 21 29 21 37 C21 43.5 25.9 48.5 32 48.5 C38.1 48.5 43 43.5 43 37 C43 29 38 21 32 12 Z" fill="url(#goldH)" />
    <!-- Leaf veins -->
    <path d="M32 16 L32 45" stroke="#103A29" stroke-width="1.5" stroke-linecap="round" />
    <path d="M32 27 Q37 30 38 33" stroke="#103A29" stroke-width="1.2" stroke-linecap="round" />
    <path d="M32 33 Q27 35 26 38" stroke="#103A29" stroke-width="1.2" stroke-linecap="round" />
    <!-- Accents -->
    <circle cx="32" cy="52" r="1.5" fill="url(#goldH)" />
  </g>

  <!-- Typography -->
  <text x="88" y="44" font-family="'Cinzel', 'Playfair Display', serif" font-size="28" font-weight="700" fill="#174D35" letter-spacing="3">GIWANSALLY</text>
  <text x="90" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#C7A45B" letter-spacing="3.5">AYURVEDIC LIQUID MANJAN</text>
  
  <!-- Subtle Ornamental Divider -->
  <line x1="335" y1="40" x2="400" y2="40" stroke="url(#goldH)" stroke-width="1" opacity="0.6" />
  <circle cx="403" cy="40" r="2" fill="url(#goldH)" />
  <text x="337" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="500" fill="#174D35" letter-spacing="1.5">BANDA, UP</text>
</svg>

