  </defs>
  
  <!-- Outer Sacred Botanical Circle -->
  <circle cx="50" cy="50" r="46" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="3 2" />
  <circle cx="50" cy="50" r="42" fill="url(#greenGrad)" />
  <circle cx="50" cy="50" r="40" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.6" />

  <!-- Botanical Leaf & Droplet Fusion (Liquid Manjan Emblem) -->
  <!-- Liquid Droplet -->
  <path d="M50 20 C42 33 34 45 34 56 C34 65.5 41.2 73 50 73 C58.8 73 66 65.5 66 56 C66 45 58 33 50 20 Z" fill="url(#goldGrad)" opacity="0.95" />
  
  <!-- Inner Herbal Leaf Vein -->
  <path d="M50 24 C50 36 50 50 50 68" stroke="#103A29" stroke-width="2" stroke-linecap="round" />
  <path d="M50 40 Q57 43 60 48" stroke="#103A29" stroke-width="1.5" stroke-linecap="round" />
  <path d="M50 46 Q43 49 40 54" stroke="#103A29" stroke-width="1.5" stroke-linecap="round" />
  <path d="M50 52 Q56 55 58 60" stroke="#103A29" stroke-width="1.5" stroke-linecap="round" />
  <path d="M50 58 Q44 61 42 66" stroke="#103A29" stroke-width="1.5" stroke-linecap="round" />

  <!-- Floating Ayurvedic Lotus Petals -->
  <path d="M26 50 C26 40 34 38 34 38 C34 38 33 46 26 50 Z" fill="url(#goldGrad)" opacity="0.75" />
  <path d="M74 50 C74 40 66 38 66 38 C66 38 67 46 74 50 Z" fill="url(#goldGrad)" opacity="0.75" />
  
  <!-- Star / Spark of Purity -->
